<!DOCTYPE html>
<html>
<head>
    <title>Job Roles</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="dashboard-layout">

    <aside class="sidebar">

        <h2>Coordinator</h2>

        <a href="coordinator-dashboard.html">Dashboard</a>
        <a href="roles.html">Job Roles</a>
        <a href="candidates.html">Candidates</a>
        <a href="schedule.html">Schedule Interviews</a>
        <a href="feedback-review.html">Feedback Reviews</a>

    </aside>

    <main class="content">

        <h1>Job Role Management</h1>

        <div class="form-container">

            <input type="text" id="title" placeholder="Job Role Title">

            <textarea id="description" placeholder="Description"></textarea>

            <select id="status">
                <option>OPEN</option>
                <option>CLOSED</option>
            </select>

            <button onclick="addRole()">Add Role</button>

        </div>

        <div class="table-section">

            <h2>Available Roles</h2>

            <table id="rolesTable">

                <tr>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Status</th>
                </tr>

            </table>

        </div>

    </main>

</div>

<script src="js/roles.js"></script>

</body>
</html>
